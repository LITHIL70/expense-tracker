<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formating Tags!! </title>
</head>
<body>
    <h1>Students Registration Form </h1>
    <form>  
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="gender">Gender:</label>
            <input type="radio"  name="gender" value="male" required />Male
            <input type="radio"  name="gender" value="female" required />Female<br><br>

            <label>Hobbies:</label>
            <input type="checkbox" name="hobbies" value="reading">Reading
            <input type="checkbox" name="hobbies" value="traveling">Traveling
            <input type="checkbox" name="hobbies" value="music">Music
            <input type="checkbox" name="hobbies" value="sports">sports
            <input type="text" name="hobbies" placeholder="Others"><br><br>

            <legend>Additional Information</legend><br>
            <label for="course">course:</label>
            <select id="course" name="course" required>
                <option value="">Select a course</option>
                <option value="FSJ">Full stack java</option>
                <option value="FSP">Full stack python</option>
                <option value="FRONTEND">HTML, CSS, JavaScript</option>
                <option value="BACKEND">java, python, mongodb, MySQL</option>
            </select><br><br>

            <label for="City">City:</label>
            <input type="text"  list="cities" name="City" required><br><br>
            <datalist id="cities">
                <option value="Hyderabad">
                <option value="Mumbai">
                <option value="Delhi">
                <option value="Chennai">
                <option value="Bangalore">
            </datalist> <br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="50" required></textarea><br><br>

            <button type="submit">Submit</button><br><br>
            <button type="reset">Reset</button>
            
        </fieldset>
    </form>
</body>
</html>
