<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST TAGS </title>
</head>
<body>
    <H1>ORDER LIST</H1>
    <OL TYPE="1" START="5" REVERSED>
        <LI>HTML</LI>
        <LI>CSS</LI>
        <LI>JAVASCRIPT</LI>
        <LI>BOOTSTRAP</LI>
        <LI>PHP</LI> 
       
    </OL>

    <H1>UNORDER LIST</H1>
    <UL TYPE="disc">
        <LI>HTML</LI>
        <LI>CSS</LI>
        <LI>JAVASCRIPT</LI>
        <LI>BOOTSTRAP</LI>
        <LI>PHP</LI>
    </UL>

    <H1>DESCRIPTION LIST</H1>
    <DL>
        <DT> FRONTEND TECHNOLOGIES</DT>
        <DD>HTML, CSS, JavaScript</DD>
    </DL>
</body>
</html>
