<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABLE</title>
</head>
<body>

            <tr>
                <td>2</td>

                <td>2 Weeks</td>
            </tr>
            <tr>
                <td>3</td>

            </tr>
            <tr>
                <td>4</td>
                <td>BOOTSTRAP</td>

            </tr>
            <tr>
                <td>5</td>

    <tfoot>
        <tr>
            <td>TOTAL DURATION : 10 WEEKS</td>
        </tr>

</html>
