<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARQUEE TAGS</title>
</head>
<body>
    <H1>MARQUEE TAGS</H1><br>
    <MARQUEE>Scrolling Text</MARQUEE>
    <MARQUEE direction="up"SCROLLAMOUNT="2S">       </MARQUEE>
    <MARQUEE direction="down"SCROLLAMOUNT="2S">Scrolling Text Downwards</MARQUEE>
    <MARQUEE direction="left"SCROLLAMOUNT="2S">Scrolling Text Left</MARQUEE>
    <MARQUEE direction="right"SCROLLAMOUNT="2S">Scrolling Text Right</MARQUEE>
    <MARQUEE behavior="alternate" LOOP="3">Scrolling Text Alternating</MARQUEE>
    <MARQUEE behavior="scroll" scrollamount="10S">Scrolling Text with Speed</MARQUEE>
    <MARQUEE behavior="slide">Scrolling Text Sliding</MARQUEE>
    >
</body>
</html>
