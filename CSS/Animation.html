<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle{
            border: 5px solid palevioletred;
            width: 100px;
            height: 100px;
            border-radius: 50%;

            animation: bounce 1s infinite alternate;

        }

        @keyframes  bounce{
            from{
                transform:
                           translateX(0)
                       
            }

            to{
                transform:
                           translateY(200px)
            }
        }

    </style>
</head>
<body>
    <div class="circle">1</div>
</body>
</html>
