<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <style>
        * {
            padding: 0;
            margin: 0;

        }

        .main-container {
            /* border: 1px solid black; */
            height: 100vh;

        }

        .header {
            /* border: 1px solid black; */
            margin: 10px;
            padding: 10px;
            background-color: orange;

        }

        .inputs {
            /* border: 1px solid black;  */
            padding: 10px;
            display: flex;
            gap: 5px;
            justify-content: space-between;
            
        }

        .form-control, .form-select tr-type{
            border: 1px solid orange;
        }

        .addbtn{
            width: 150px;
            height: 60px;
            border-radius: 50%;
            font-weight: bold;
            border: none;
            background-color: orange;
        }

        .cards{
            /* border: 1px solid black; */
            padding: 20px;
            margin: 10px;
            display: flex;
            justify-content: space-between;
        }

        .card{
            background-color: orange;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 15px 25px, rgba(0, 0, 0, 0.05) 0px 5px 10px;
            margin: 20px;
            
        }

        .table{
            /* border: 1px solid black; */
            padding: 10px;
            margin: 2px;
        }


        .table th{
            background-color: orange;
            align-items: center;
            justify-content: center;

        }

        .table td{
            background-color: #f2f2f2;
            border: 1px solid orange;
            align-items: center;
            justify-content: center;
        }


    </style>
</head>

<body>
    <div class="main-container">

        <div class="header">
            <h1>Expense Tracker</h1>

        </div>

        <div class="inputs">

                <div class="input-group flex-nowrap">
                    <input type="date" class="form-control" placeholder="Date" aria-label="Username"
                        aria-describedby="addon-wrapping" id="date">
                </div>
                
                
                <div class="input-group flex-nowrap">
                    <input type="text" class="form-control" placeholder="Enter Amount" aria-label="Username"
                        aria-describedby="addon-wrapping" id="amount">
                </div>
                
                
                <select class="form-select tr-type" aria-label="Default select example">
                    <option selected>Select Transaction Type</option>
                    <option  value="deposit">Deposit</option>
                    <option  value="expense">Expense</option>
                </select>

                <button onclick="addbtn()"  class="addbtn" id="addbtn">+</button>


        </div>

        <div class="cards">
            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Total Balance</h5>
                    <h3><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-currency-rupee" viewBox="0 0 16 16">
                    <path d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z"/>
                    </svg><span id="tb">0</span></h3>
                    
                </div>
            </div>
        
           <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Total Expense</h5>
                    <h3><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-currency-rupee" viewBox="0 0 16 16">
                    <path d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z"/>
                    </svg><span id="te">0</span></h3>
                    
                </div>
            </div>
        
            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">Total Income</h5>
                    <h3><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-currency-rupee" viewBox="0 0 16 16">
                    <path d="M4 3.06h2.726c1.22 0 2.12.575 2.325 1.724H4v1.051h5.051C8.855 7.001 8 7.558 6.788 7.558H4v1.317L8.437 14h2.11L6.095 8.884h.855c2.316-.018 3.465-1.476 3.688-3.049H12V4.784h-1.345c-.08-.778-.357-1.335-.793-1.732H12V2H4z"/>
                    </svg><span id="ti">0</span></h3>
                    
                </div>
            </div>
        </div>


        <div class="table">
        
            <table class="table" id="table">
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Transaction Type</th>
                        <th scope="col">Amount</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
        
            </table>
        </div>
        
        </div>



    <script>
        let transactiontable = document.querySelector("table");


        function addbtn(){
            let date = document.getElementById("date").value
            let amount = document.getElementById("amount").value
            let transactionType = document.getElementsByClassName("tr-type")[0].value
           


            //  console.log(transactionType)


            //updatind table

            let row = document.createElement("tr")

            let dateCell = document.createElement("td")
            dateCell.innerText = date

            let trCell = document.createElement("td")
            trCell.innerText = transactionType


            let amountCell = document.createElement("td")
            amountCell.innerText = amount


            let deleteCell = document.createElement("td")


            let deletebtn = document.createElement("button")
            deletebtn.innerText = "Delete"
            deletebtn.classList.add("btn", "btn-danger")
            deletebtn.onclick = () => deleteRow(row)
            
            

            deleteCell.appendChild(deletebtn)

            row.appendChild(dateCell)
            row.appendChild(trCell)
            row.appendChild(amountCell)
            row.appendChild(deleteCell)

            transactiontable.appendChild(row)


            //updating cards
            let totalBalance=document.getElementById("tb").innerText
            let totalExpense=document.getElementById("te").innerText
            let totalIncome=document.getElementById("ti").innerText

            // console.log(totalBalance, totalExpense, totalIncome)

            if(transactionType=="deposit"){

                if(totalBalance=="0"){
                    document.getElementById("tb").innerText=amount
                }else{
                    document.getElementById("tb").innerText=parseInt(totalBalance)+parseInt(amount)
                }
                
            
                if(totalIncome=="0"){
                    document.getElementById("ti").innerText=amount
                }else{
                    document.getElementById("ti").innerText=parseInt(totalIncome)+parseInt(amount)
                }

            }else if(transactionType=="expense"){

                    document.getElementById("tb").innerText=parseInt(totalBalance)-parseInt(amount)
                
            
                if(totalExpense=="0"){
                    document.getElementById("te").innerText=amount
                }else{
                    document.getElementById("te").innerText=parseInt(totalExpense)+parseInt(amount)
                }

            }


        }

        function deleteRow(row){
           row.remove()
        }





    </script>
</body>

</html>
