<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        .parent{
            width: 200px;
            height: 200px;
            background-color: tomato;
            border: 1px solid black;
            position: relative;
            
        }

        .child{
            width: 100px;
            height: 100px;
            background-color: 1px solid black;
            position: absolute;
            background-color: aqua;
            right: 0;
            
        }
    </style>
</head>
<body>
    <div class="parent">

        <div class="child"></div>
    </div>
</body>
</html>
