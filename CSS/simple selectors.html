<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /*Tag Name*/
        h1{
            background-color: yellow;
        }

        /*Grouping selectors*/
        h1, h2 {
            color: blue;
        }

        /*universal selector*/
        *{
            font-style: italic;
        }

        /*id selector*/
        #heading{
            font-size: 80px;
        }

        #header{
            font-family: Arial, sans-serif;
        }

        /*class selector*/
        .para{
            color: red;
            text-decoration: underline;
            font-weight: bold;
        }

        /*they are 5 types of simple selectors
        1. Tag Name 
        2. Grouping selectors
        3. Universal selector   
        4. Id selector
        5. Class selector 
        ----each of them hass their own specific use and can be used to target elements in different ways.
        simple selectors, combinators, psuedo-classes, psuedo-elements, artibutes */
    </style>
</head>
<body>
    <h1 id="heading">Simple Selectors</h1>

    <h2 id="header">Heading 2</h2>

    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>
    <p class="para">This is yet another paragraph.</p>
</body>
</html>
