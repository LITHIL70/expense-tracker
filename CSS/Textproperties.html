<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*text properties*/

        /* text colour*/
        h1 {
            color: red;
        }

        /* text alignment */
        h1 {
            text-align: center;
        }

        /* text decoration */
        h1 {
            text-decoration: underline wavy blue;
        }

        /* text transform */
        .para {
            text-transform: capitalize;
        }

        /* text indentation */
        .para {
            text-indent: 50px;
        }

        /* text spacing */
        .text-left{
            letter-spacing: 5px;
            word-spacing: 10px;
        }

        /* text shadow */
        .para {
            text-shadow: 2px 2px 1px rgb(154, 157, 207);
        }

        /* text wrap */
        .para {
            text-wrap: wrap;
        }


    </style>


</head>
<body>
    <h1>Text Properties</h1>
    <p class="para">this is a paragraph with some text Lorem ipsum dolor sit amet consectetur adipisicing elit. Earum architecto illum deleniti pariatur veniam soluta perspiciatis. Dolor vitae cupiditate debitis?.</p>

    <h2>Text Alignment</h2>
    <p class="text-left">This a para using class attribute.</p>
</html>
