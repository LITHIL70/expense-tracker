<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   

    <script>
        ///count even and odd nums
        let num =20;
        for(let i=1; i<=num; i++){
            if(i%2==0){
                console.log(i + " is even");
            }else{
                console.log(i + " is odd");
            }
        }

        ////find largest number in array
        let arr = [10, 20,200, 30, 40, 50];
        let largest = arr[0];
        for(let i=0; i<arr.length; i++){
            if(arr[i] > largest){
                largest = arr[i];
            }
        }
        console.log("The largest number is: " + largest);


        /// find the smallest num
        let smallest=[10,20,30,400,1];
        let smallestnum=smallest[0];
        for(let i=0;i<smallest.length;i++){
            if(smallest[i]<smallestnum){
                smallestnum=smallest[i];
            }
        }
        console.log("The smallest number is: " + smallestnum);  


        ///count positive , negative, zero

        let numbers=[10,20,30,-10,-10,-30,0,0,0,-20];
        let positive=0;
        let negative=0;
        let zero=0;
        for(let i=0; i<numbers.length; i++){
            if(numbers[i]>0){
                positive++;
            }else if(numbers[i]<0){
                negative++;
            }else{
                zero++;
            }
        }
        console.log("Positive numbers: " + positive);
        console.log("Negative numbers: " + negative);
        console.log("Zeroes: " + zero);

        //sum of array elements
        let sumArr=[10,20,30,40,50];
        let sum=0;
        for(let i=0; i<sumArr.length; i++){
            sum+=sumArr[i];
        }
        console.log("The sum of array elements is: " + sum);


        ///average of array elements
        let avgArr=[10,20,30,40,50];
        let total=0;
        for(let i=0; i<avgArr.length; i++){
            total+=avgArr[i];
        }
        let average=total/avgArr.length;
        console.log("The average of array elements is: " + average);

    </script>
</body>
</html>
