<!DOCTYPE html>
<html lang="en">

<head>

    <title>LOGO.com</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: url(./background.jpg) no-repeat;
            background-size: cover;
            background-position: center;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 100px;
            display: flex;
            justify-content: space-between;
            z-index: 99;
            align-items: center;
        }

        .logo {
            font-size: 2em;
            color: #fff;
            user-select: none;

        }


        .navigation a {
            position: relative;
            font-size: 1.1em;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            margin-left: 40px;

        }

        .navigation a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 100%;
            height: 3px;
            background: #fff;
            border-radius: 5px;
            transform-origin: left;
            transform: scaleX(0);
            transition: .5s;
        }

        .navigation a:hover::after {
            transform-origin: right;
            transform: scaleX(1);
        }



        .navigation .btnlogin {
            width: 130px;
            height: 50px;
            background: transparent;
            border: 2px solid #fff;
            outline: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 1.1em;
            color: #fff;
            font-weight: 500;
            margin-left: 40px;
            transition: .5s;

        }

        .navigation .btnlogin:hover {
            background: #fff;
            color: #162938;
        }

        .wrapper {
            position: relative;
            width: 400px;
            height: 440px;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, .5);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(0, 0, 0, .5);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transform: scale(0);
            transition: .100s ease-out, .5s ease, .2s ease;

        }

        .wrapper.active-popup{
            transform: scale(1);
        }

        .wrapper.active{
            height: 520px;
        }

        .wrapper .form-login-box {
            width: 100%;
            padding: 40px;

        }

        .wrapper .form-login-box.login {
            transition: .18s ease;
            transform: translateX(0);
        }

        .wrapper.active .form-login-box.login {
            transition: none;
            transform: translateX(-420px);
        }

        .wrapper .form-login-box.Register {
            position: absolute;
            transition: none;
            transform: translateX(400px);
        }

        .wrapper.active .form-login-box.Register {
            transition: .18s ease;
            transform: translateX(0);
        }

        .wrapper .icon-close {
            position: absolute;
            top: 0;
            right: 0;
            background: #162938;
            font-size: 2em;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom-left-radius: 20px;
            cursor: pointer;
            z-index: 1;
            width: 45px;
            height: 45px;

        }

        .form-login-box h2 {

            font-size: 2em;
            color: #162938;
            text-align: center;

        }

        .input-box {
            position: relative;
            width: 100%;
            height: 50px;
            border-bottom: 2px solid #162938;
            margin: 30px 0;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 5px;
            transform: translateY(-50%);
            font-size: 1em;
            color: #162938;
            font-weight: 500;
            pointer-events: none;
            transition: .5s;
        }

        .input-box input:focus~label,
        .input-box input:valid~label {
            top: -5px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-weight: 600;
            font-size: 1em;
            color: #162938;
            padding: 0 35px 0 5px;

        }

        .input-box .icon {
            position: absolute;
            right: 10px;
            font-size: 1.2em;
            color: #162938;
            line-height: 57px;


        }

        .remember-forget {
            font-size: .9em;
            color: #162938;
            font-weight: 500;
            margin: -15px 0 15px;
            display: flex;
            justify-content: space-between;
        }


        .remember-forget label input {
            accent-color: #162938;
            margin-right: 7px;
        }

        .remember-forget a {
            color: red;
            text-decoration: none;
        }

        .remember-forget a:hover {
            text-decoration: underline;

        }


        .btn {
            width: 100%;
            height: 45px;
            background: #27506f;
            border: none;
            outline: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            color: #7a7c8d;
            font-weight: 800;
            transition: .5s all;
        }

        .btn:hover {
            background-color: #162938;
            color: #fff;
        }

        .login-register {
            font-size: .9em;
            color: #dc0b1c;
            text-align: center;
            font-weight: 500;
            margin: 25px 0 10px;
        }


        .login-register p a {
            color: #162938;
            text-decoration: none;
            font-weight: 600;
        }

        .login-register p a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>


    <header>
        <h2 class="logo">Logo</h2>
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
            <button class="btnlogin">Login</button>
        </nav>
    </header>

    <div class="wrapper">

        <span class="icon-close"><i class="bx bx-x"></i></span>



        <div class="form-login-box  login">
            <h2>Login</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><i class='bx bxl-gmail'></i></span>
                    <input type="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <div class="remember-forget">
                    <label><input type="checkbox">Remember Me</label>
                    <a href="#">Forget Password</a>
                </div>
                <button type="submit" class="btn">Login</button>

                <div class="login-register">
                    <p>Don't have an account?<a href="#" class="register-link"> Register </a>here</p>
                </div>
            </form>
        </div>


        <div class="form-login-box Register">
            <h2>Registration</h2>
            <form action="#">
                <div class="input-box">
                    <span class="icon"><i class="bx bx-user"></i></span>
                    <input type="text" required>
                    <label>Username</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class='bx bxl-gmail'></i></span>
                    <input type="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                    <input type="password" required>
                    <label>Password</label>
                </div>
                <div class="remember-forget">
                    <label><input type="checkbox">I agree to the terms & conditions</label>

                </div>
                <button type="submit" class="btn">Register</button>

                <div class="login-register">
                    <p>Already have an account?<a href="#" class="login-link"> Login </a>here</p>
                </div>
            </form>
        </div>
    </div>









    <script>
        const wrapper=document.querySelector('.wrapper')
        const loginLink = document.querySelector('.login-link')
        const registerLink = document.querySelector('.register-link')
        const btnpopup = document.querySelector('.btnlogin')
        const iconclose = document.querySelector('.icon-close')



        loginLink.addEventListener('click', () => {
            wrapper.classList.remove('active')
        });


        registerLink.addEventListener('click', () => {
            wrapper.classList.add('active');
        });

        btnpopup.addEventListener('click', () => {
            wrapper.classList.add('active-popup');
        });

        iconclose.addEventListener('click', () => {
            wrapper.classList.remove('active-popup');
        });
    </script>
</body>

</html>
